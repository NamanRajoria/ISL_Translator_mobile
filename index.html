<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>ISL Translator — Mobile (Square Preview)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --app-bg: #2f4156;
    --accent: #567c8d;
    --panel-bg: #f5efeb;
    --text: #ffffff;
    --muted: rgba(255,255,255,0.75);
    --bubble-deaf-bg: #567c8d;
    --bubble-hear-bg: rgba(255,255,255,0.06);
  }
  html,body{height:100%;margin:0;background:var(--app-bg);color:var(--text);font-family:Inter,system-ui,Arial;}
  .app{max-width:920px;margin:12px auto;padding:12px;box-sizing:border-box;}
  .container{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:900px){ .container{grid-template-columns: 1fr 420px; align-items:start;} }

  /* Camera / image area */
  .camera-wrap{
    background: var(--accent); /* requested accent background when camera off */
    border-radius:12px;
    overflow:hidden;
    position:relative;
    border: 2px solid rgba(255,255,255,0.04);
    display:flex;flex-direction:column;
    min-height:0;
    align-items:center;
  }
  /* square preview */
  #canvas{width:100%;height:auto;display:block;background:var(--accent);}
  .controls-top{position:absolute;left:12px;top:12px;display:flex;gap:8px;z-index:40}
  .ctrl-btn{padding:8px 10px;border-radius:8px;border:0;background:rgba(0,0,0,0.35);color:var(--text);cursor:pointer}
  .hud-bottom{position:relative;padding:12px;background:transparent;display:flex;flex-direction:column;gap:12px;width:100%}

  .detected-large{font-size:40px;font-weight:800;color:var(--text);text-align:center}
  .buffer-row{display:flex;gap:8px;align-items:center;justify-content:center}
  .buffer{flex:1;padding:12px;border-radius:10px;background:rgba(255,255,255,0.06);color:var(--text);font-weight:700;min-height:48px;text-align:center}
  .send-btn{width:56px;height:48px;border-radius:10px;border:0;background:var(--panel-bg);color:#042026;font-weight:800;font-size:20px;cursor:pointer}

  .chat-panel{background:transparent;border-radius:12px;min-height:200px;display:flex;flex-direction:column;gap:12px}
  .chat-window{background:rgba(0,0,0,0.06);padding:12px;border-radius:10px;max-height:58vh;overflow:auto}
  .chat-controls{display:flex;gap:8px;align-items:center;margin-top:8px}
  .mic-btn{width:56px;height:56px;border-radius:12px;border:0;background:var(--panel-bg);color:#042026;font-size:18px;cursor:pointer}
  .input{flex:1;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:var(--text)}
  .send-local{padding:10px 12px;border-radius:10px;border:0;background:var(--panel-bg);color:#042026;cursor:pointer}
  .clear-chat{padding:8px 10px;border-radius:8px;border:0;background:rgba(255,255,255,0.04);color:var(--text);cursor:pointer;margin-left:auto}
  .bubble{padding:10px;border-radius:10px;margin-bottom:8px;word-break:break-word;max-width:85%}
  .bubble.deaf{background:var(--bubble-deaf-bg);color:#042026;align-self:flex-start}
  .bubble.hear{background:var(--bubble-hear-bg);color:var(--text);align-self:flex-end}
  .small{font-size:13px;color:var(--muted)}
  .perm{padding:10px;border-radius:8px;background:rgba(0,0,0,0.4);color:var(--panel-bg);margin:8px;display:none}
  .chat-window::-webkit-scrollbar{height:6px;width:6px}
  .chat-window::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);border-radius:6px}
</style>
</head>
<body>
  <div class="app">
    <div class="container">
      <div class="camera-wrap" id="cameraWrap">
        <div class="controls-top">
          <button class="ctrl-btn" id="start">Start</button>
          <button class="ctrl-btn" id="stop">Stop</button>
          <button class="ctrl-btn" id="clearBufferBtn">Clear</button>
        </div>

        <video id="video" autoplay playsinline muted style="display:none"></video>
        <!-- square canvas preview -->
        <canvas id="canvas" width="1640" height="1640" aria-label="Camera preview"></canvas>

        <div class="hud-bottom">
          <div style="display:flex;align-items:center;justify-content:center;">
            <div class="detected-large" id="label">—</div>
          </div>

          <div class="buffer-row">
            <div id="buffer" class="buffer" aria-live="polite">—</div>
            <button id="sendBtn" class="send-btn" title="Send">→</button>
          </div>
        </div>

        <div class="perm" id="perm">Camera permission appears blocked. Tap Start then allow camera in your browser settings.</div>
      </div>

      <div class="chat-panel">
        <div style="font-weight:700">Conversation</div>
        <div class="chat-window" id="chatWindow" aria-live="polite"></div>

        <div class="chat-controls">
          <button id="micBtn" class="mic-btn" title="Tap to talk">🎤</button>
          <input id="transcript" class="input" placeholder="Type or speak a message..." />
          <button id="localSend" class="send-local">Send</button>
          <button id="clearChat" class="clear-chat">Clear Chat</button>
        </div>
        <div class="small">Tip: Hold a letter steady for 2s to add it to the buffer. Remove hands for 2s to insert a space.</div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script>
/* Square preview fixes & iPhone resolution handling
 - Keep a mirrored preview for user (MIRROR=true)
 - set Mediapipe selfieMode:false so landmarks are in camera coords (no double-mirror)
 - request square 640x640 as ideal; attempt applyConstraints after start
 - centralize transform handling so landmark drawing uses same coordinate space
*/
const INFER_FPS = 12;
const LETTER_HOLD_MS = 2000;
const NO_HAND_MS = 2000;
const SMOOTH_WINDOW = 4;
const MAX_CROP_PERCENT = 0.12; // cap to avoid excessive crop on iPhone
const MIRROR = true; // preview mirror for user-facing UX

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('start');
const stopBtn = document.getElementById('stop');
const clearBufferBtn = document.getElementById('clearBufferBtn');
const labelEl = document.getElementById('label');
const bufferEl = document.getElementById('buffer');
const perm = document.getElementById('perm');
const sendBtn = document.getElementById('sendBtn');

const chatWindow = document.getElementById('chatWindow');
const micBtn = document.getElementById('micBtn');
const transcript = document.getElementById('transcript');
const localSend = document.getElementById('localSend');
const clearChat = document.getElementById('clearChat');

let weights=null, classes=null;
(async function loadW(){
  const MODEL_FILES = ['weights.json','model-weights.json','model_weights.json'];
  for(const n of MODEL_FILES){
    try{ const r=await fetch(n); if(!r.ok) continue; const j=await r.json(); weights=j; classes=j.classes||null; return; }catch(e){}
  }
})();

function denseForward(x,kernel,bias){ const inD=kernel.length, outD=kernel[0].length; const out=new Float32Array(outD); for(let j=0;j<outD;j++){ let s=0; for(let i=0;i<inD;i++) s+=x[i]*kernel[i][j]; s+=bias[j]; out[j]=s;} return out;}
function relu(x){ for(let i=0;i<x.length;i++) if(x[i]<0) x[i]=0; return x;}
function softmax(x){ let max=-Infinity; for(let i=0;i<x.length;i++) if(x[i]>max) max=x[i]; let s=0; const out=new Float32Array(x.length); for(let i=0;i<x.length;i++){ out[i]=Math.exp(x[i]-max); s+=out[i]; } for(let i=0;i<x.length;i++) out[i]/=s; return out;}
function argmax(a){ let b=0; for(let i=1;i<a.length;i++) if(a[i]>a[b]) b=i; return b; }

/* mediapipe: IMPORTANT change selfieMode:false to avoid double-mirroring landmarks */
const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
hands.setOptions({ maxNumHands:2, modelComplexity:1, selfieMode:false, minDetectionConfidence:0.5, minTrackingConfidence:0.5 });
hands.onResults(onResults);

/* state */
let recentPreds = [];
let wordBuffer = '';
let candidateLabel = null;
let candidateStart = 0;
let lastHandSeenAt = 0;
let spaceInsertedAt = 0;
let lastAppendTime = 0;
let lastTick = 0;

/* central transform & sizing */
function updateCanvasSquare(){
  const container = document.getElementById('cameraWrap');
  if(!container) return;
  const dpr = window.devicePixelRatio || 1;
  const cw = Math.min(container.clientWidth, 720); // cap width
  const cssSize = cw;
  canvas.style.width = cssSize + 'px';
  canvas.style.height = cssSize + 'px';
  canvas.width = Math.round(cssSize * dpr);
  canvas.height = Math.round(cssSize * dpr);

  // Reset transform: scale by dpr and optionally flip horizontally for mirror preview.
  ctx.setTransform(dpr * (MIRROR ? -1 : 1), 0, 0, dpr, MIRROR ? canvas.width : 0, 0);
}
window.addEventListener('resize', updateCanvasSquare);
updateCanvasSquare();

/* start camera with ideal square resolution to reduce auto-zoom */
startBtn.onclick = async () => {
  perm.style.display='none';
  try{
    const constraints = { video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 640 }, frameRate: { ideal: 30 } }, audio: false };
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    // attach
    video.srcObject = stream;
    await video.play();

    // try to apply constraints to force smaller resolution (best-effort)
    try{
      const [track] = stream.getVideoTracks();
      if(track && track.applyConstraints){
        // attempt to force square-ish settings (some browsers ignore)
        await track.applyConstraints({ width: 640, height: 640, aspectRatio: 1.0 });
      }
      const settings = track.getSettings ? track.getSettings() : {};
      console.log('Camera settings:', settings);
      // helpful debug: on iPhone Safari you'll see the real width/height chosen
    }catch(e){ console.warn('applyConstraints failed', e); }

    video.addEventListener('loadedmetadata', () => { updateCanvasSquare(); }, { once: true });
    lastTick = performance.now();
    requestAnimationFrame(tick);
  }catch(e){
    perm.style.display='block';
    console.error('Camera error', e);
    alert('Camera error: '+ (e.message || e.name));
  }
};
stopBtn.onclick = ()=>{ if(video.srcObject){ video.srcObject.getTracks().forEach(t=>t.stop()); video.srcObject=null; } };
clearBufferBtn.onclick = ()=>{ wordBuffer=''; bufferEl.innerText='—'; };

/* send */
sendBtn.onclick = ()=> {
  const text = wordBuffer.trim();
  if(!text) return;
  addChatBubble(text, 'DEAF');
  try{ const u = new SpeechSynthesisUtterance(text); u.lang='en-US'; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
  wordBuffer=''; bufferEl.innerText='—';
};

/* main loop */
async function tick(ts){
  requestAnimationFrame(tick);
  const dt = ts - lastTick;
  if(dt < (1000/INFER_FPS)) return;
  lastTick = ts;
  if(video.readyState >= 2) await hands.send({image: video});
}

/* compute limited crop (cover-like) but capped */
function computeCoverCrop(vw, vh, targetW, targetH){
  const videoAspect = vw / vh;
  const targetAspect = targetW / targetH;
  let sx=0, sy=0, sw=vw, sh=vh;
  if(videoAspect > targetAspect){
    sw = Math.round(vh * targetAspect);
    sx = Math.round((vw - sw)/2);
    const cropPercent = (vw - sw) / vw;
    if(cropPercent > MAX_CROP_PERCENT){
      const allowedCrop = Math.round(vw * MAX_CROP_PERCENT);
      sw = vw - allowedCrop;
      sx = Math.round((vw - sw)/2);
    }
  } else {
    sh = Math.round(vw / targetAspect);
    sy = Math.round((vh - sh)/2);
    const cropPercent = (vh - sh) / vh;
    if(cropPercent > MAX_CROP_PERCENT){
      const allowedCrop = Math.round(vh * MAX_CROP_PERCENT);
      sh = vh - allowedCrop;
      sy = Math.round((vh - sh)/2);
    }
  }
  return { sx, sy, sw, sh };
}

/* draw video into square canvas */
function drawVideoToCanvasSquare(){
  if(!video || !video.videoWidth || !video.videoHeight) return;
  updateCanvasSquare();
  const cssW = canvas.clientWidth;
  const cssH = canvas.clientHeight;
  if(cssW === 0 || cssH === 0) return;
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  const crop = computeCoverCrop(vw, vh, cssW, cssH);
  const sx = crop.sx, sy = crop.sy, sw = crop.sw, sh = crop.sh;

  // drawImage maps source crop to full canvas area (canvas is already scaled by dpr in transform)
  try{
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
  }catch(e){
    // fallback to direct draw if something unexpected occurs
    ctx.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    // restore transform for subsequent draws
    ctx.setTransform((window.devicePixelRatio || 1) * (MIRROR ? -1 : 1), 0, 0, window.devicePixelRatio || 1, MIRROR ? canvas.width : 0, 0);
  }
}

/* onResults: draw frame, landmarks, prediction logic */
function onResults(results){
  drawVideoToCanvasSquare();

  const now = performance.now();
  if(results.multiHandLandmarks && results.multiHandLandmarks.length > 0){
    lastHandSeenAt = now;
    const handsArr = results.multiHandLandmarks;
    drawLandmarksMapped(handsArr);
    const all_hands_px = handsArr.map(h => h.map(lm => ({x: lm.x * canvas.clientWidth, y: lm.y * canvas.clientHeight})));
    const vec = twoHandsXYToVector(all_hands_px);

    let voted = null;
    if(weights){
      try{
        let out0 = denseForward(vec, weights.layers[0].kernel, weights.layers[0].bias); out0 = relu(out0);
        let out1 = denseForward(out0, weights.layers[1].kernel, weights.layers[1].bias); out1 = relu(out1);
        let out2 = denseForward(out1, weights.layers[2].kernel, weights.layers[2].bias);
        const probs = softmax(out2); const idx = argmax(probs);
        voted = (weights.classes && weights.classes[idx]) ? weights.classes[idx] : String(idx);
        recentPreds.push(voted); if(recentPreds.length > SMOOTH_WINDOW) recentPreds.shift();
        const counts = {}; for(const v of recentPreds) counts[v] = (counts[v]||0)+1;
        let mv = recentPreds[recentPreds.length-1]; let maxc=0;
        for(const k in counts) if(counts[k] > maxc){ maxc = counts[k]; mv = k; }
        voted = mv;
      }catch(e){ voted = null; }
    } else { voted = null; }

    labelEl.innerText = voted || '—';

    if(voted){
      if(candidateLabel !== voted){
        candidateLabel = voted;
        candidateStart = now;
      } else {
        if(now - candidateStart >= LETTER_HOLD_MS){
          if(now - lastAppendTime > 300){
            wordBuffer += candidateLabel;
            bufferEl.innerText = wordBuffer;
            lastAppendTime = now;
          }
          candidateLabel = null; candidateStart = 0;
        }
      }
    } else { candidateLabel = null; candidateStart = 0; }

  } else {
    labelEl.innerText = '—';
    if(now - lastHandSeenAt >= NO_HAND_MS && wordBuffer && (now - spaceInsertedAt > NO_HAND_MS)){
      if(wordBuffer.slice(-1) !== ' '){ wordBuffer += ' '; bufferEl.innerText = wordBuffer; spaceInsertedAt = now; }
    }
    candidateLabel = null; candidateStart = 0;
  }
}

/* draw landmarks mapped to crop. NOTE: because canvas transform already flips if MIRROR=true,
   we compute positions in canvas coordinate space and draw directly — no extra flip needed.
*/
function drawLandmarksMapped(handsArr){
  ctx.save();
  ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=2;
  const connections = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20]];

  const cw = canvas.clientWidth; const ch = canvas.clientHeight;
  const vw = video.videoWidth || 1; const vh = video.videoHeight || 1;
  const crop = computeCoverCrop(vw, vh, cw, ch);
  const sx = crop.sx, sy = crop.sy, sw = crop.sw, sh = crop.sh;
  const scaleX = cw / sw; const scaleY = ch / sh;

  ctx.beginPath();
  for(const hand of handsArr){
    for(const c of connections){
      const a = hand[c[0]], b = hand[c[1]];
      const ax = ((a.x * vw) - sx) * scaleX;
      const ay = ((a.y * vh) - sy) * scaleY;
      const bx = ((b.x * vw) - sx) * scaleX;
      const by = ((b.y * vh) - sy) * scaleY;
      ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
    }
  }
  ctx.stroke();
  for(const hand of handsArr){
    for(let i=0;i<hand.length;i++){
      const p = hand[i];
      const px = ((p.x * vw) - sx) * scaleX;
      const py = ((p.y * vh) - sy) * scaleY;
      ctx.beginPath(); ctx.arc(px, py, i===8?6:4,0,Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}

/* vectorization */
function twoHandsXYToVector(all_hands_px){
  if(all_hands_px.length >= 2) all_hands_px = all_hands_px.sort((a,b)=>a[0].x - b[0].x);
  function singleVec(pxs){
    const wrist = pxs[0]; const pts=[]; let maxd=0;
    for(let i=0;i<pxs.length;i++){ const dx = pxs[i].x - wrist.x, dy = pxs[i].y - wrist.y; pts.push(dx); pts.push(dy); const d=Math.hypot(dx,dy); if(d>maxd) maxd=d; }
    if(maxd===0) maxd=1; const out = new Float32Array(42);
    for(let i=0;i<21;i++){ out[i*2]=pts[i*2]/maxd; out[i*2+1]=pts[i*2+1]/maxd; } return out;
  }
  const v1 = (all_hands_px.length>=1)? singleVec(all_hands_px[0]) : new Float32Array(42);
  const v2 = (all_hands_px.length>=2)? singleVec(all_hands_px[1]) : new Float32Array(42);
  const concat = new Float32Array(84); concat.set(v1,0); concat.set(v2,42); return concat;
}

/* permission hint */
(async function checkPerm(){ if(!navigator.permissions) return; try{ const s = await navigator.permissions.query({name:'camera'}).catch(()=>null); if(s && s.state === 'denied') document.getElementById('perm').style.display='block'; }catch(e){} })();

/* CHAT helpers */
function addChatBubble(text, who='DEAF'){
  const el = document.createElement('div');
  el.className = 'bubble ' + (who === 'DEAF' ? 'deaf' : 'hear');
  el.innerHTML = (who === 'DEAF' ? '<strong>DEAF →</strong> ' : '<strong>HEARING →</strong> ') + escapeHtml(text);
  chatWindow.appendChild(el);
  chatWindow.scrollTop = chatWindow.scrollHeight;
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, (m)=> ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* STT and controls */
let recognition = null;
let listening = false;
if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new Rec();
  recognition.lang = 'en-US';
  recognition.interimResults = true;
  recognition.onresult = (ev) => {
    let interim = ''; let finalTrans = '';
    for(let i=0;i<ev.results.length;i++){
      const r = ev.results[i];
      if(r.isFinal) finalTrans += r[0].transcript;
      else interim += r[0].transcript;
    }
    transcript.value = (finalTrans + interim).trim();
  };
  recognition.onend = ()=> { listening=false; micBtn.style.opacity=1; micBtn.innerText='🎤'; };
  recognition.onerror = (e)=> { console.warn('STT error', e); listening=false; micBtn.style.opacity=1; micBtn.innerText='🎤'; };
} else { micBtn.disabled = true; micBtn.title = 'SpeechRecognition not supported'; }
micBtn.addEventListener('click', ()=>{
  if(!recognition) return;
  if(!listening){ recognition.start(); listening=true; micBtn.style.opacity=0.8; micBtn.innerText='●'; }
  else { recognition.stop(); listening=false; micBtn.style.opacity=1; micBtn.innerText='🎤'; }
});
localSend.addEventListener('click', ()=>{ const t = transcript.value.trim(); if(!t) return; addChatBubble(t, 'HEARING'); try{ const u = new SpeechSynthesisUtterance(t); u.lang='en-US'; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} transcript.value=''; });
clearChat.addEventListener('click', ()=> { chatWindow.innerHTML = ''; });

</script>
</body>
</html>
