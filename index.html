<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>ISL Mobile Parent — 2s rules</title>
<style>
  :root{ --bg:#071320; --panel:#0b1b24; --accent:#00ffd1; --muted:#9fb0c6; --bubble-deaf:#0f2430; --bubble-hear:#0b2a22;}
  html,body{height:100%;margin:0;background:var(--bg);color:#e6eef8;font-family:system-ui,Arial;padding:12px;box-sizing:border-box;}
  .app{max-width:420px;margin:0 auto;}
  .frameWrap{height:52vh;border-radius:12px;overflow:hidden;background:#000;border:2px solid #0f2b35;}
  iframe{width:100%;height:100%;border:0;display:block;}
  .hud{display:flex;gap:8px;align-items:center;padding:10px 0}
  .buffer{flex:1;padding:10px;border-radius:10px;background:rgba(255,255,255,0.03);font-size:18px;font-weight:700;color:var(--accent);min-height:48px;display:flex;align-items:center}
  .sendBtn{width:52px;height:48px;border-radius:10px;border:0;background:var(--accent);color:#002;padding:0;font-weight:700;font-size:20px;cursor:pointer}
  .small{color:var(--muted);font-size:13px}
  .chat{margin-top:12px;max-height:34vh;overflow:auto;padding:8px;border-radius:10px;background:transparent}
  .bubble{padding:10px;border-radius:10px;margin-bottom:10px;word-break:break-word}
  .bubble.deaf{background:var(--bubble-deaf); color:#cfeffd;}
  .bubble.hear{background:var(--bubble-hear); color:#dfffdc; text-align:right}
  .status{margin-top:8px;color:var(--muted);font-size:13px}
  .controls{display:flex;gap:8px;margin-top:8px;align-items:center}
  .btn{padding:8px 10px;border-radius:8px;border:0;background:#0b2830;color:#cfeffd;cursor:pointer}
</style>
</head>
<body>
  <div class="app">
    <h3 style="margin:6px 0 12px 0">ISL — Mobile Parent (2s rules)</h3>

    <div class="frameWrap">
      <iframe id="islIframe" src="/mnt/data/index.html" allow="camera; microphone; autoplay" title="ISL iframe"></iframe>
    </div>

    <div class="hud">
      <div id="bufferDisplay" class="buffer" aria-live="polite">—</div>
      <button id="sendBtn" class="sendBtn" title="Send">→</button>
    </div>

    <div class="controls">
      <button id="clearBtn" class="btn">Clear</button>
      <div class="small" id="statusText">Status: waiting for detection...</div>
    </div>

    <div class="chat" id="chatArea" aria-live="polite"></div>
  </div>

<script>
(function(){
  const iframe = document.getElementById('islIframe');
  const bufferDisplay = document.getElementById('bufferDisplay');
  const sendBtn = document.getElementById('sendBtn');
  const clearBtn = document.getElementById('clearBtn');
  const chatArea = document.getElementById('chatArea');
  const statusText = document.getElementById('statusText');

  // Timing config
  const HOLD_MS = 2000;      // same-letter hold to append
  const NO_HAND_MS = 2000;   // no-detections to insert space

  // State
  let lastLabel = null;
  let labelStart = 0;
  let holdTimer = null;
  let noHandTimer = null;
  let lastDetectionAt = 0;
  let wordBuffer = '';
  let spacePending = false;

  function updateBufferUI(){
    bufferDisplay.innerText = wordBuffer.length ? wordBuffer : '—';
  }

  function appendLetter(letter){
    if(!letter) return;
    wordBuffer += letter;
    updateBufferUI();
    // also notify iframe or parent logic as needed
    // we forward a DETECTION-like event into chat timeline as token (optional visual)
    const token = document.createElement('span');
    token.style.cssText = 'display:inline-block;padding:6px 10px;border-radius:14px;background:#042a2a;color:var(--accent);margin:4px';
    token.innerText = letter;
    chatArea.appendChild(token);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function appendSpace(){
    // only if buffer not empty and last char is not space
    if(wordBuffer && wordBuffer.slice(-1) !== ' '){
      wordBuffer += ' ';
      updateBufferUI();
      const s = document.createElement('div'); s.className='bubble deaf'; s.innerText='[space inserted]';
      chatArea.appendChild(s);
      chatArea.scrollTop = chatArea.scrollHeight;
    }
  }

  function flushAsMessage(){
    const text = wordBuffer.trim();
    if(!text) return;
    // add to chat area as deaf message
    const b = document.createElement('div'); b.className = 'bubble deaf';
    b.innerHTML = '<strong>DEAF →</strong> ' + escapeHtml(text);
    chatArea.appendChild(b);
    chatArea.scrollTop = chatArea.scrollHeight;
    // clear buffer
    wordBuffer = '';
    updateBufferUI();
    // Optionally, send to iframe via postMessage (if you want iframe TTS)
    try{
      iframe.contentWindow.postMessage({ type:'MESSAGE', payload:{ text } }, '*');
    }catch(e){}
  }

  function clearBuffer(){
    wordBuffer = '';
    updateBufferUI();
  }

  // export helpers for console debugging
  window.__mobileParent = {
    getBuffer: ()=> wordBuffer,
    appendLetter,
    appendSpace,
    flushAsMessage,
    clearBuffer
  };

  // Send button behavior
  sendBtn.addEventListener('click', () => {
    flushAsMessage();
    // tiny button feedback
    sendBtn.style.transform = 'scale(0.96)';
    setTimeout(()=> sendBtn.style.transform = '', 120);
  });

  clearBtn.addEventListener('click', () => {
    clearBuffer();
  });

  // handle incoming messages from iframe
  window.addEventListener('message', (ev) => {
    const msg = ev.data || {};
    if(!msg.type) return;
    // Accept DETECTION and STATUS messages
    if(msg.type === 'DETECTION' && msg.payload){
      const p = msg.payload;
      // Consider tokenType LETTER as the candidate label from iframe
      if(p.tokenType === 'LETTER' && p.value){
        handleDetectionLabel(String(p.value));
      } else if(p.tokenType === 'SYSTEM' && p.value === 'NO_HANDS'){
        // explicit no-hands signal (optional)
        handleNoHands();
      } else if(p.tokenType === 'WORD'){
        // iframe sent a full word - add to chat
        const b = document.createElement('div'); b.className='bubble deaf';
        b.innerHTML = '<strong>DEAF →</strong> ' + escapeHtml(String(p.value || ''));
        chatArea.appendChild(b);
        chatArea.scrollTop = chatArea.scrollHeight;
      }
      lastDetectionAt = Date.now();
      statusText.innerText = 'Status: detection received';
    } else if(msg.type === 'STATUS' && msg.payload){
      // if iframe provides camera or buffer info
      if('camera' in msg.payload){
        statusText.innerText = 'Status: camera ' + msg.payload.camera;
      }
      if('buffer' in msg.payload){
        // optional keep in sync
        wordBuffer = msg.payload.buffer || wordBuffer;
        updateBufferUI();
      }
      lastDetectionAt = Date.now();
    } else if(msg.type === 'MESSAGE' && msg.payload){
      // accept final messages from iframe
      const b = document.createElement('div'); b.className='bubble deaf';
      b.innerHTML = '<strong>DEAF →</strong> ' + escapeHtml(String(msg.payload.text || ''));
      chatArea.appendChild(b);
      chatArea.scrollTop = chatArea.scrollHeight;
    }
  });

  // handle label candidate logic
  function handleDetectionLabel(label){
    const now = Date.now();
    if(lastLabel !== label){
      // new label candidate - restart hold timer
      lastLabel = label;
      labelStart = now;
      if(holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
      holdTimer = setTimeout(() => {
        appendLetter(label);
        // after appending, reset candidate
        lastLabel = null;
        holdTimer = null;
      }, HOLD_MS);
    } else {
      // same label continuing - ensure timer exists
      if(!holdTimer){
        const elapsed = now - labelStart;
        const remaining = Math.max(0, HOLD_MS - elapsed);
        holdTimer = setTimeout(() => {
          appendLetter(label); lastLabel = null; holdTimer = null;
        }, remaining);
      }
    }
    // reset no-hand timer because we received detection
    if(noHandTimer){ clearTimeout(noHandTimer); noHandTimer = null; }
    // ensure we know detections ongoing
    lastDetectionAt = now;
  }

  function handleNoHands(){
    // start no-hand timer if not present
    if(noHandTimer) return;
    noHandTimer = setTimeout(() => {
      appendSpace();
      noHandTimer = null;
    }, NO_HAND_MS);
  }

  // fallback: if no DETECTION messages received for NO_HAND_MS (e.g., iframe didn't emit NO_HANDS),
  // treat as no-hands
  setInterval(() => {
    const now = Date.now();
    if(now - lastDetectionAt > NO_HAND_MS){
      // start no-hand behavior
      handleNoHands();
    }
  }, 500);

  // small HTML escape helper
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, (m)=> ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  // initial UI update
  updateBufferUI();
  statusText.innerText = 'Status: ready';
})();
</script>
</body>
</html>
